---
project:
  name: WebSphere APP Automation
  description: Git-backed WebSphere application-pair maintenance automation
  scm_branch: main
  scm_clean: true
  scm_delete_on_update: true
  scm_update_on_launch: true
  scm_update_cache_timeout: 0

template:
  name: WAS - Reboot Nodes by Wave
  description: >-
    Reboot every Node 2 application host concurrently, require complete
    recovery, then reboot Node 1 hosts and their co-located deployment managers.
  playbook: ansible/playbooks/was_wave_reboot.yml
  local_lab_playbook: playbooks/was_wave_reboot.yml
  job_type: run
  verbosity: 1
  allow_simultaneous: false

survey:
  name: Reboot WebSphere application pairs by wave
  description: >-
    Host-specific members, Dmgr placement, and direct health URLs come from
    inventory. This survey authorizes and bounds one maintenance run.
  spec:
    - question_name: Authorize operating-system reboots
      question_description: >-
        Must be enabled for the job to pass preflight. Node 2 runs first;
        Node 1 and its co-located deployment manager run second.
      required: true
      type: multiplechoice
      variable: was_maintenance_allow_reboot
      choices: |-
        false
        true
      default: "false"
      min: null
      max: null
      new_question: true
    - question_name: Maintenance inventory group
      question_description: >-
        Inventory group containing every Node 1/Node 2 application host in
        this run. Each host must declare was_maintenance_wave.
      required: true
      type: text
      variable: maintenance_inventory_group
      min: 1
      max: 128
      default: was_nodes
      new_question: true
    - question_name: Require direct application health checks
      question_description: >-
        Keep enabled in production. Each host supplies its own direct URLs in
        was_maintenance_health_urls.
      required: true
      type: multiplechoice
      variable: was_maintenance_require_health_checks
      choices: |-
        true
        false
      default: "true"
      min: null
      max: null
      new_question: true
    - question_name: Operating-system reboot timeout (seconds)
      question_description: Maximum time Ansible waits for each host to reboot and reconnect.
      required: true
      type: integer
      variable: was_maintenance_reboot_timeout
      min: 300
      max: 7200
      default: 1800
      new_question: true
    - question_name: Deployment-manager startup timeout (seconds)
      question_description: >-
        Maximum time allowed to start a co-located Dmgr and restore its SOAP
        connector before the Node 1 applications are started.
      required: true
      type: integer
      variable: was_maintenance_dmgr_start_timeout
      min: 120
      max: 3600
      default: 600
      new_question: true
