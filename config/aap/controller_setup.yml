---
version: 1

# Keep the controller API credential on the one setup template. Generated
# operational templates prompt for their Machine and WebSphere credentials at
# launch through AAP's native credential step.
credential_mode: prompt

templates:
  - key: wave_reboot
    name: WAS - Reboot Nodes by Wave
    description: >-
      Discover each two-host WebSphere cell, reboot every non-Dmgr (Node 2)
      host concurrently, require complete runtime recovery, then reboot every
      Dmgr (Node 1) host concurrently.
    playbook: ansible/playbooks/was_wave_reboot.yml
    local_lab_playbook: playbooks/was_wave_reboot.yml
    job_type: run
    verbosity: 1
    allow_simultaneous: false
    ask_variables_on_launch: false
    ask_credential_on_launch: true
    ask_forks_on_launch: true
    forks: 0
    survey:
      name: Reboot WebSphere application pairs by wave
      description: >-
        The job discovers cells, nodes, cluster members, co-located Dmgrs,
        waves, and pre-maintenance application runtime state. The survey only
        authorizes and bounds this maintenance run.
      spec:
        - question_name: Authorize operating-system reboots
          question_description: >-
            Must be enabled for the job to pass preflight. All Node 2 hosts run
            first; Node 1 hosts and their co-located Dmgrs run second.
          required: true
          type: multiplechoice
          variable: was_maintenance_allow_reboot
          choices: |-
            false
            true
          default: "false"
          min: null
          max: null
          new_question: true
        - question_name: Maintenance inventory group
          question_description: >-
            Inventory group containing the hostnames/IPs for every two-host
            WebSphere cell included in this run.
          required: true
          type: text
          variable: maintenance_inventory_group
          min: 1
          max: 128
          default: was_nodes
          new_question: true
        - question_name: Operating-system reboot timeout (seconds)
          question_description: Maximum time Ansible waits for each host to reboot and reconnect.
          required: true
          type: integer
          variable: was_maintenance_reboot_timeout
          min: 300
          max: 7200
          default: 1800
          new_question: true
        - question_name: Deployment-manager startup timeout (seconds)
          question_description: >-
            Maximum time allowed to start a co-located Dmgr and restore its SOAP
            connector before Node 1 applications are started.
          required: true
          type: integer
          variable: was_maintenance_dmgr_start_timeout
          min: 120
          max: 3600
          default: 600
          new_question: true
