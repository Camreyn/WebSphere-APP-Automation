---
- name: Mark this maintenance host incomplete for the current run
  ansible.builtin.set_fact:
    was_maintenance_host_recovered: false

- name: Validate guarded wave-reboot inputs
  ansible.builtin.assert:
    that:
      - was_maintenance_allow_reboot | bool
      - was_maintenance_dmgr_host | length > 0
      - >-
        (was_maintenance_members | length > 0) or
        (
          was_cluster_name is defined and
          was_node_name is defined and
          was_server_name is defined
        )
      - >-
        (not (was_maintenance_require_health_checks | bool)) or
        (was_maintenance_health_urls | length > 0)
    fail_msg: >-
      Wave reboot requires explicit authorization, a Dmgr target, WebSphere
      member identity, and at least one direct health URL unless health checks
      were explicitly disabled.

- name: Require the injected WebSphere administrative credential
  ansible.builtin.assert:
    that:
      - was_admin_user | default('') | length > 0
      - was_admin_password | default('') | length > 0
    fail_msg: A WebSphere administrative credential is required.
  no_log: true

- name: Build the managed-server list for this host
  ansible.builtin.set_fact:
    was_maintenance_effective_members: >-
      {{
        was_maintenance_members
        if (was_maintenance_members | length > 0)
        else [
          {
            'cluster': was_cluster_name,
            'node': was_node_name,
            'name': was_server_name
          }
        ]
      }}

- name: Validate every managed-server identity before stopping anything
  ansible.builtin.assert:
    that:
      - was_maintenance_member.cluster | default('') | length > 0
      - was_maintenance_member.node | default('') | length > 0
      - >-
        was_maintenance_member.name | default(
          was_maintenance_member.server | default('')
        ) | length > 0
    fail_msg: Each maintenance member requires cluster, node, and name/server.
  loop: "{{ was_maintenance_effective_members }}"
  loop_control:
    loop_var: was_maintenance_member

- name: Validate every direct application health check before stopping anything
  ansible.builtin.assert:
    that:
      - >-
        (was_maintenance_health_check is string and
         was_maintenance_health_check | length > 0) or
        (was_maintenance_health_check is mapping and
         was_maintenance_health_check.url | default('') | length > 0)
    fail_msg: Every health-check entry must be a URL or a mapping with a url field.
  loop: "{{ was_maintenance_health_urls }}"
  loop_control:
    loop_var: was_maintenance_health_check

- name: Stop every managed server on this host cleanly
  waslab.wasnd.cluster_member:
    install_root: "{{ was_maintenance_dmgr_install_root }}"
    profile_name: "{{ was_maintenance_dmgr_profile_name }}"
    host: "{{ was_maintenance_dmgr_soap_host }}"
    port: "{{ was_maintenance_dmgr_soap_port }}"
    username: "{{ was_admin_user }}"
    password: "{{ was_admin_password }}"
    cluster: "{{ was_maintenance_member.cluster }}"
    node: "{{ was_maintenance_member.node }}"
    name: "{{ was_maintenance_member.name | default(was_maintenance_member.server | default('server1')) }}"
    state: stopped
  delegate_to: "{{ was_maintenance_dmgr_host }}"
  become: true
  become_user: "{{ was_maintenance_dmgr_os_user }}"
  register: was_maintenance_member_stop
  retries: "{{ was_maintenance_member_stop_retries }}"
  delay: "{{ was_maintenance_member_stop_delay }}"
  until: >-
    (was_maintenance_member_stop is succeeded) and
    (not (was_maintenance_member_stop.get('after', {}).get('running', true) | bool))
  loop: "{{ was_maintenance_effective_members }}"
  loop_control:
    loop_var: was_maintenance_member
    label: >-
      {{ was_maintenance_member.cluster }}/{{ was_maintenance_member.node }}/{{
      was_maintenance_member.name | default(was_maintenance_member.server | default('server1')) }}

- name: Stop the node agent cleanly before reboot
  waslab.wasnd.profile_runtime:
    install_root: "{{ was_install_root }}"
    profile_name: "{{ was_maintenance_node_profile_name }}"
    profile_type: node
    username: "{{ was_admin_user }}"
    password: "{{ was_admin_password }}"
    state: stopped
  become: true
  become_user: "{{ was_maintenance_node_os_user }}"

- name: Stop the co-located deployment manager last
  waslab.wasnd.profile_runtime:
    install_root: "{{ was_maintenance_dmgr_install_root }}"
    profile_name: "{{ was_maintenance_dmgr_profile_name }}"
    profile_type: dmgr
    username: "{{ was_admin_user }}"
    password: "{{ was_admin_password }}"
    timeout: "{{ was_maintenance_dmgr_start_timeout }}"
    state: stopped
  become: true
  become_user: "{{ was_maintenance_dmgr_os_user }}"
  when: was_maintenance_hosts_dmgr | bool

- name: Reboot the operating system and wait for its Ansible connection
  ansible.builtin.reboot:
    reboot_timeout: "{{ was_maintenance_reboot_timeout }}"
    connect_timeout: "{{ was_maintenance_reboot_connect_timeout }}"
    pre_reboot_delay: "{{ was_maintenance_pre_reboot_delay }}"
    post_reboot_delay: "{{ was_maintenance_post_reboot_delay }}"
    test_command: "{{ was_maintenance_reboot_test_command }}"
  become: true

- name: Start the co-located deployment manager first after reboot
  waslab.wasnd.profile_runtime:
    install_root: "{{ was_maintenance_dmgr_install_root }}"
    profile_name: "{{ was_maintenance_dmgr_profile_name }}"
    profile_type: dmgr
    username: "{{ was_admin_user }}"
    password: "{{ was_admin_password }}"
    timeout: "{{ was_maintenance_dmgr_start_timeout }}"
    state: started
  become: true
  become_user: "{{ was_maintenance_dmgr_os_user }}"
  when: was_maintenance_hosts_dmgr | bool

- name: Wait for the recovered deployment-manager SOAP connector
  ansible.builtin.wait_for:
    host: "{{ was_maintenance_dmgr_soap_host }}"
    port: "{{ was_maintenance_dmgr_soap_port }}"
    timeout: "{{ was_maintenance_dmgr_soap_timeout }}"
    state: started
  when: was_maintenance_hosts_dmgr | bool

- name: Start the node agent after reboot
  waslab.wasnd.profile_runtime:
    install_root: "{{ was_install_root }}"
    profile_name: "{{ was_maintenance_node_profile_name }}"
    profile_type: node
    username: "{{ was_admin_user }}"
    password: "{{ was_admin_password }}"
    state: started
  become: true
  become_user: "{{ was_maintenance_node_os_user }}"

- name: Start every managed server on the recovered host
  waslab.wasnd.cluster_member:
    install_root: "{{ was_maintenance_dmgr_install_root }}"
    profile_name: "{{ was_maintenance_dmgr_profile_name }}"
    host: "{{ was_maintenance_dmgr_soap_host }}"
    port: "{{ was_maintenance_dmgr_soap_port }}"
    username: "{{ was_admin_user }}"
    password: "{{ was_admin_password }}"
    cluster: "{{ was_maintenance_member.cluster }}"
    node: "{{ was_maintenance_member.node }}"
    name: "{{ was_maintenance_member.name | default(was_maintenance_member.server | default('server1')) }}"
    state: started
  delegate_to: "{{ was_maintenance_dmgr_host }}"
  become: true
  become_user: "{{ was_maintenance_dmgr_os_user }}"
  register: was_maintenance_member_start
  retries: "{{ was_maintenance_member_start_retries }}"
  delay: "{{ was_maintenance_member_start_delay }}"
  until: >-
    (was_maintenance_member_start is succeeded) and
    (was_maintenance_member_start.get('after', {}).get('running', false) | bool)
  loop: "{{ was_maintenance_effective_members }}"
  loop_control:
    loop_var: was_maintenance_member
    label: >-
      {{ was_maintenance_member.cluster }}/{{ was_maintenance_member.node }}/{{
      was_maintenance_member.name | default(was_maintenance_member.server | default('server1')) }}

- name: Verify every application endpoint directly on the recovered host
  ansible.builtin.uri:
    url: >-
      {{
        was_maintenance_health_check.url
        if (was_maintenance_health_check is mapping)
        else was_maintenance_health_check
      }}
    method: GET
    status_code: >-
      {{
        was_maintenance_health_check.status_code | default(200)
        if (was_maintenance_health_check is mapping)
        else 200
      }}
    validate_certs: >-
      {{
        was_maintenance_health_check.validate_certs | default(was_maintenance_validate_certs)
        if (was_maintenance_health_check is mapping)
        else was_maintenance_validate_certs
      }}
  delegate_to: localhost
  become: false
  register: was_maintenance_health
  retries: "{{ was_maintenance_health_retries }}"
  delay: "{{ was_maintenance_health_delay }}"
  until: was_maintenance_health is succeeded
  loop: "{{ was_maintenance_health_urls }}"
  loop_control:
    loop_var: was_maintenance_health_check
    label: >-
      {{
        was_maintenance_health_check.url
        if (was_maintenance_health_check is mapping)
        else was_maintenance_health_check
      }}

- name: Mark this maintenance host recovered
  ansible.builtin.set_fact:
    was_maintenance_host_recovered: true
