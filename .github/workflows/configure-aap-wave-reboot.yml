---
name: Configure AAP wave-reboot automation

on:
  workflow_dispatch:
    inputs:
      scm_branch:
        description: Git branch AAP should synchronize
        required: true
        type: string
        default: main
      project_name:
        description: Optional AAP project-name override
        required: false
        type: string
      template_name:
        description: Optional AAP job-template-name override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: configure-aap-wave-reboot
  cancel-in-progress: false

jobs:
  configure:
    name: Configure project, template, and survey
    runs-on: ${{ vars.AAP_RUNNER || 'ubuntu-latest' }}
    environment: ${{ vars.AAP_GITHUB_ENVIRONMENT || 'aap' }}
    timeout-minutes: 20
    env:
      AAP_HOST: ${{ secrets.AAP_HOST }}
      AAP_OAUTH_TOKEN: ${{ secrets.AAP_OAUTH_TOKEN }}
      AAP_API_PREFIX: ${{ vars.AAP_API_PREFIX }}
      AAP_VALIDATE_CERTS: ${{ vars.AAP_VALIDATE_CERTS }}
      AAP_ORGANIZATION: ${{ vars.AAP_ORGANIZATION }}
      AAP_INVENTORY: ${{ vars.AAP_INVENTORY }}
      AAP_EXECUTION_ENVIRONMENT: ${{ vars.AAP_EXECUTION_ENVIRONMENT }}
      AAP_PROJECT_NAME: ${{ inputs.project_name || vars.AAP_PROJECT_NAME }}
      AAP_TEMPLATE_NAME: ${{ inputs.template_name || vars.AAP_TEMPLATE_NAME }}
      AAP_PROJECT_SCM_URL: ${{ vars.AAP_PROJECT_SCM_URL }}
      AAP_PROJECT_SCM_BRANCH: ${{ inputs.scm_branch }}
      AAP_SCM_CREDENTIAL: ${{ vars.AAP_SCM_CREDENTIAL }}
      AAP_JOB_CREDENTIALS: ${{ vars.AAP_JOB_CREDENTIALS }}
    steps:
      - name: Check out the automation repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.scm_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-aap-bootstrap.txt

      - name: Install the AAP bootstrap dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-aap-bootstrap.txt

      - name: Configure AAP idempotently
        id: configure
        run: python tools/configure_aap_wave_reboot.py

      - name: Publish the configuration summary
        run: |
          {
            echo "### AAP wave-reboot automation"
            echo ""
            echo "- Project: ${{ steps.configure.outputs.project_name }}"
            echo "- Job template: ${{ steps.configure.outputs.template_name }}"
            echo "- SCM branch: ${{ inputs.scm_branch }}"
          } >> "$GITHUB_STEP_SUMMARY"
